schema_version: "0.1"
project_id: ARTURO-PERSONAL-001
decisions:
  - id: ARTURO-SITE-D-001
    status: approved
    statement: The personal site will be synchronized from the same governed nodes used for LinkedIn rather than copying LinkedIn text verbatim.
    owner: Arturo Villagomez
    rationale: Shared nodes preserve coherence while channel-specific interpretation preserves usefulness.
    affects: [website, linkedin, github]
  - id: ARTURO-SITE-D-002
    status: approved
    statement: The site will be published iteratively as a governed v1 rather than delayed until every Personal Knowledge Graph domain is complete.
    owner: Arturo Villagomez
    rationale: Real use creates evidence and supports simultaneous project execution.
    affects: [publication, observability]
  - id: ARTURO-SITE-D-003
    status: approved
    statement: Old website copy is treated as historical input and must not govern current public positioning.
    owner: AVOS Governor
    rationale: The current site contains outdated roles, claims and positioning.
    affects: [copy, claims, experience]
  - id: ARTURO-SITE-D-004
    status: pending
    statement: Approve the final public project list and treatment of each role before publication.
    owner: Arturo Villagomez
    review_trigger: completion of claims and project evidence audit
